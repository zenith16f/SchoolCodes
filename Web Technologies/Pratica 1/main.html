<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Practica 1</title>
  </head>
  <body>
    <h1>Formulario T</h1>

    <table border="1">
      <thead align="center">
        <tr>
          <th>Id</th>
          <th>Nombre</th>
          <th>Edad</th>
          <th>Juego Favorito</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Paco</td>
          <td>22</td>
          <td>Hollow Knight</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Isaac</td>
          <td>31</td>
          <td>Call of Duty</td>
        </tr>
        <tr>
          <td>3</td>
          <td>Jenny</td>
          <td>19</td>
          <td>Cyberpunk 2077</td>
        </tr>
      </tbody>
    </table>

    <h2>Insertar Formulario Aqui</h2>

    <h3>Formulario Formulariante</h3>
    <p>Llena el formulario como tu corazon te lo diga, indique y desee</p>
    <form>
      <label for=""> Correo </label>
      <input
        type="email"
        placeholder="algo@algo.algo"
        name=""
        id=""
      />
      <br />
      <br />
      <label for=""> Nombre </label>
      <input
        type="text"
        placeholder="Jhon"
        name=""
        id=""
      />
      <label for=""> Apellido </label>
      <input
        placeholder="Doe"
        type="text"
        name=""
        id=""
      />
      <br />
      <br />
      <label for=""> Nombre de Usuario </label>
      <input
        type="text"
        placeholder="JhonDoe"
        name=""
        id=""
      />
      <br />
      <br />
      <label for=""> Edad </label>
      <input
        type="number"
        min="0"
        max="99"
        name=""
        id=""
      />
      <hr />
      <label for="">Foto de Perfil</label>
      <input
        type="image"
        src="Image.jpg"
        alt="Aqui va tu foto"
      />

      <br />
      <br />

      <label for="">Soundtrack de Perfil</label>
      <input type="file" />
      <br />
      <br />
      <label for="">Color de Perfil</label>
      <input
        type="color"
        name=""
        id=""
      />
      <br />
      <br />

      <hr />
      <label for="">Ingresa tu juego favorito</label>
      <input
        type="text"
        placeholder="Juego"
        name=""
        id=""
      />
      <br />
      <br />

      <label for="">Razon para que sea el favorito</label>
      <textarea
        name=""
        id=""
      ></textarea>

      <hr />
      <input
        type="reset"
        value="Vaciar"
      />

      <button type="submit">Guardar</button>
    </form>
  </body>
</html>
