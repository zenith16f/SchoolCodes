<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculadora</title>
    <link href="styles/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="calculadora">
      <h1>Calculadora</h1>
      <input type="text" name="" id="Pantalla2" value="" />
      <div class="calculadora">
        <button type="" id="toggleTema">Cambiar tema</button>
        <input type="text" name="" id="Pantalla" value="" />
        <div class="botones">
          <button type="" onclick="limpiar()">C</button>
          <button type="" onclick="regresar()">⌫</button>
          <button type="" onclick="insertar('(')">(</button>
          <button type="" onclick="insertar(')')">)</button>
          <button type="" onclick="insertar('%')">%</button>
          <button type="" onclick="insertar('7')">7</button>
          <button type="" onclick="insertar('8')">8</button>
          <button type="" onclick="insertar('9')">9</button>
          <button type="" onclick="insertar('/')">÷</button>
          <button type="" onclick="raiz()">√</button>
          <button type="" onclick="insertar('4')">4</button>
          <button type="" onclick="insertar('5')">5</button>
          <button type="" onclick="insertar('6')">6</button>
          <button type="" onclick="insertar('*')">×</button>
          <button type="" onclick="insertar('**')">xⁿ</button>
          <button type="" onclick="insertar('1')">1</button>
          <button type="" onclick="insertar('2')">2</button>
          <button type="" onclick="insertar('3')">3</button>
          <button type="" onclick="insertar('-')">−</button>
          <button type="" onclick="cambiarSigno()">+/−</button>
          <button type="" onclick="insertar('0')" class="cero">0</button>
          <button type="" onclick="insertar('.')">.</button>
          <button type="" onclick="insertar('+')">+</button>
          <button type="" onclick="calcular()">=</button>
        </div>
      </div>
    </div>
    <script src="scripts/script.js"></script>
  </body>
</html>
