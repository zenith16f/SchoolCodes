<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Guesser</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="css/style.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container">
      <div class="card">
        <span class="badge">1 – 10</span>
        <h1>Juego de adivinanza</h1>
        <p class="subtitle">Intenta adivinar un número entre el 1 y el 10</p>

        <div class="controles">
          <input
            type="number"
            id="numero"
            placeholder="0"
            min="1"
            max="10"
          />
          <button onclick="jugar()">Adivinar</button>
        </div>

        <p id="resultado"></p>

        <div
          class="intentos"
          id="intentos"
        ></div>
      </div>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
